<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111a30"><meta name="description" content="A polished home for your work, skills, and professional story."><title>Crackers — Your work, thoughtfully presented</title>
<style>
:root{color-scheme:light;--ink:#172033;--muted:#66728a;--purple:#6558e8;--line:rgba(255,255,255,.72);--glass:rgba(255,255,255,.68);--shadow:0 18px 52px rgba(24,36,71,.1)}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font:15px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 12% 8%,rgba(129,117,255,.18),transparent 34%),radial-gradient(ellipse at 87% 30%,rgba(104,217,190,.2),transparent 34%),linear-gradient(135deg,#fafaff,#eef2fb 58%,#f8f9fc);background-attachment:fixed}button,input,textarea,select{font:inherit}button{cursor:pointer}.skip{position:fixed;top:10px;left:12px;z-index:9;transform:translateY(-150%);background:white;padding:9px 13px;border-radius:9px}.skip:focus{transform:none}:focus-visible{outline:3px solid #8b80ff;outline-offset:3px}.shell{max-width:1240px;margin:auto;padding:26px 34px 54px}.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px}.brand{display:flex;align-items:center;gap:11px;font-weight:850;font-size:18px;letter-spacing:-.5px}.logo{display:grid;place-items:center;width:40px;height:40px;border-radius:14px;color:white;background:linear-gradient(135deg,#8175ff,#564bd0);box-shadow:0 8px 20px #665ae546}.bar-actions{display:flex;gap:10px}.btn{border:1px solid rgba(255,255,255,.85);background:rgba(255,255,255,.72);backdrop-filter:blur(12px);border-radius:11px;padding:10px 15px;color:var(--ink);font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.18s}.btn:hover{transform:translateY(-1px);box-shadow:0 9px 22px #18244718}.primary{background:var(--purple);color:white;border-color:var(--purple)}.primary:hover{background:#5144d2}.danger{color:#ad3749}.glass{background:var(--glass);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);backdrop-filter:blur(18px) saturate(145%);-webkit-backdrop-filter:blur(18px) saturate(145%)}.eyebrow{text-transform:uppercase;letter-spacing:1.7px;font-weight:800;font-size:11px;color:var(--purple)}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(34px,5vw,58px);line-height:1.08;letter-spacing:-2.2px;margin:8px 0 14px}h2{letter-spacing:-.7px}.muted{color:var(--muted)}.hero{padding:clamp(25px,6vw,62px);position:relative;overflow:hidden;min-height:280px;background:linear-gradient(125deg,rgba(255,255,255,.82),rgba(255,255,255,.49))}.hero:after{content:"";position:absolute;width:340px;height:340px;border:1px solid #665ae522;border-radius:50%;right:-90px;top:-105px;box-shadow:0 0 0 36px #665ae50a,0 0 0 74px #665ae507;pointer-events:none}.hero-copy{position:relative;z-index:1;max-width:760px}.hero p{font-size:17px;color:#59657c;max-width:670px}.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.grid{display:grid;gap:18px}.stats{grid-template-columns:repeat(3,1fr);margin:18px 0}.stat{padding:21px}.stat strong{font-size:27px;display:block;letter-spacing:-1px}.stat span{font-size:13px;color:var(--muted)}.section{margin:34px 0 15px;display:flex;justify-content:space-between;align-items:end}.section h2{margin:0;font-size:22px}.projects{grid-template-columns:repeat(3,minmax(0,1fr))}.project{padding:15px;transition:transform .2s,box-shadow .2s}.project:hover{transform:translateY(-3px);box-shadow:0 22px 52px #1824471d}.cover{height:140px;border-radius:14px;display:grid;place-items:center;font-size:46px;background:linear-gradient(135deg,#e6e5ff,#f1f0ff);margin-bottom:17px}.cover.green{background:linear-gradient(135deg,#d8f7e9,#effcf6)}.cover.orange{background:linear-gradient(135deg,#ffe8d4,#fff7ef)}.project h3{margin:0 0 7px}.project p{font-size:14px;color:var(--muted);min-height:45px}.pills{display:flex;gap:7px;flex-wrap:wrap;margin:13px 0}.pill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px;background:#efeffb;color:#5551a1}.project-links{display:flex;gap:13px;font-weight:700;font-size:13px}.project-links a,.public-link{color:#5145ca;text-decoration:none}.project-links a:hover,.public-link:hover{text-decoration:underline}.skillbox{padding:23px}.skills{display:flex;gap:9px;flex-wrap:wrap}.skill{padding:9px 13px;background:rgba(255,255,255,.75);border:1px solid #fff;border-radius:11px;font-weight:700}.certs{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.cert{padding:17px 19px;display:flex;gap:13px;align-items:center}.certicon{width:42px;height:42px;border-radius:13px;background:#fff2d9;display:grid;place-items:center;font-size:20px}.footer{margin-top:55px;text-align:center;color:#8791a4;font-size:12px}.dashboard{display:none}.dashgrid{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px}.sidenav{padding:20px;height:max-content;position:sticky;top:20px}.sidenav h2{font-size:16px}.sidenav a{display:block;padding:9px 10px;text-decoration:none;color:#536078;border-radius:9px;font-weight:650}.sidenav a:hover{background:#fff9;color:#242b42}.editor{padding:clamp(20px,4vw,34px);margin-bottom:16px}.editor h2{margin-bottom:4px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800;color:#505b72}.field input,.field textarea,.field select{width:100%;border:1px solid rgba(115,126,155,.28);background:rgba(255,255,255,.82);border-radius:10px;padding:11px 12px;color:var(--ink)}.field textarea{min-height:100px;resize:vertical}.field input:focus,.field textarea:focus{outline:none;border-color:#8176ee;box-shadow:0 0 0 4px #8176ee20}.formactions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.project-row{display:flex;align-items:center;gap:12px;border-top:1px solid #e7e9f1;padding:13px 0}.project-row:first-of-type{border:0}.project-row .grow{flex:1}.project-row p{font-size:13px;margin:0;color:var(--muted)}.check{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}.status{font-size:12px;min-height:20px;color:#14845b;margin-top:8px}.login-wrap{min-height:75vh;display:grid;place-items:center}.login{width:min(440px,100%);padding:34px}.login h1{font-size:34px;letter-spacing:-1px}.login .field{margin:22px 0 14px}.notice{padding:13px 15px;border-radius:12px;background:#f4f1ff;color:#5449c5;font-size:13px}.hidden{display:none!important}
@media(max-width:900px){.projects{grid-template-columns:repeat(2,minmax(0,1fr))}.dashgrid{grid-template-columns:1fr}.sidenav{position:static;display:flex;gap:5px;overflow:auto;align-items:center}.sidenav h2{display:none}.sidenav a{white-space:nowrap}.sidenav .btn{margin-left:auto;white-space:nowrap}}@media(max-width:620px){.shell{padding:16px 14px 35px}.bar{margin-bottom:20px}.brand{font-size:16px}.bar-actions .hide-small{display:none}.hero{min-height:0}.stats{gap:9px}.stat{padding:15px}.stat strong{font-size:22px}.projects,.certs{grid-template-columns:1fr}.project p{min-height:0}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.section{margin-top:27px}.editor{padding:19px}.project-row{align-items:flex-start;flex-wrap:wrap}.project-row .grow{min-width:60%}.sidenav{margin-bottom:0;padding:10px}.sidenav .btn{padding:8px 10px}}@media(max-width:370px){.stats{grid-template-columns:1fr}.logo{width:35px;height:35px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
/* Enhanced glass surfaces, print layout, and backup controls. */
body{background:radial-gradient(ellipse at 8% 10%,rgba(129,117,255,.23),transparent 36%),radial-gradient(ellipse at 86% 23%,rgba(104,217,190,.24),transparent 36%),radial-gradient(ellipse at 70% 95%,rgba(255,192,144,.16),transparent 30%),linear-gradient(135deg,#fafaff,#eaf0fb 58%,#f8f9fc);background-attachment:fixed}.glass{background:rgba(255,255,255,.46);border-color:rgba(255,255,255,.82);box-shadow:0 20px 58px rgba(24,36,71,.11),inset 0 1px 0 rgba(255,255,255,.8);backdrop-filter:blur(24px) saturate(175%);-webkit-backdrop-filter:blur(24px) saturate(175%)}.bar{position:sticky;top:10px;z-index:5;padding:9px 13px;border:1px solid rgba(255,255,255,.75);border-radius:17px;background:rgba(249,250,255,.60);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);box-shadow:0 12px 34px rgba(24,36,71,.07)}.hero{border-color:rgba(255,255,255,.9);background:linear-gradient(125deg,rgba(255,255,255,.62),rgba(255,255,255,.30))}.project:hover{border-color:#fff}.btn{border-color:rgba(255,255,255,.9);background:rgba(255,255,255,.68);backdrop-filter:blur(14px)}.sidenav{background:rgba(250,251,255,.48)}.field input,.field textarea,.field select{background:rgba(255,255,255,.72)}.backup-tools{display:flex;gap:8px;flex-wrap:wrap}.backup-tools input[type=file]{display:none}.bar-actions{align-items:center}.bar .btn{white-space:nowrap}@media print{body{background:white!important}.shell{max-width:none;padding:0}.bar{position:static;background:white;box-shadow:none;border:0;padding:0;margin-bottom:24px}.bar-actions,.footer{display:none!important}.glass{background:white!important;border:1px solid #ddd!important;box-shadow:none!important;backdrop-filter:none!important;break-inside:avoid}.hero:after{display:none}.project{break-inside:avoid}.projects{grid-template-columns:repeat(2,1fr)}}/* Motion polish: gentle entrance, floating hero glow, and responsive card hover. */
@keyframes page-enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes glow-drift{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-12px,12px,0) scale(1.04)}}
@keyframes ring-turn{from{transform:rotate(0deg)}to{transform:rotate(12deg)}}
.hero,.welcome{animation:page-enter .72s cubic-bezier(.2,.7,.25,1) both}
.card,.glass.stat,.glass.project,.glass.cert,.skillbox{animation:page-enter .62s cubic-bezier(.2,.7,.25,1) both}
.card:nth-child(2),.project:nth-child(2),.cert:nth-child(2){animation-delay:90ms}
.card:nth-child(3),.project:nth-child(3){animation-delay:160ms}
.card:nth-child(4){animation-delay:220ms}
.hero:after{transform-origin:center;animation:glow-drift 8s ease-in-out infinite}
.welcome:after{transform-origin:center;animation:ring-turn 9s ease-in-out infinite alternate}
.project,.card{transition:transform .28s cubic-bezier(.2,.7,.25,1),box-shadow .28s ease,border-color .28s ease}
.project:hover,.card:hover{transform:translateY(-4px)}
.btn{transition:transform .2s ease,box-shadow .2s ease,background-color .2s ease}
.btn:hover{transform:translateY(-2px)}
@media(prefers-reduced-motion:reduce){.hero,.welcome,.card,.glass.stat,.glass.project,.glass.cert,.skillbox,.hero:after,.welcome:after{animation:none!important}.project:hover,.card:hover,.btn:hover{transform:none}}
</style></head>
<body><a class="skip" href="#main">Skip to content</a><div id="app"></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const blank={profile:{name:'Your Name',headline:'Student · Aspiring Software Developer',location:'Your City',email:'',website:'',github:'',linkedin:'',about:'Write a short introduction about what you are learning, building, and hoping to do next.'},projects:[],skills:[],certificates:[],resume:{summary:'',experience:'',achievements:''}};
let data=structuredClone(blank), editId=null, isPublic=location.pathname==='/portfolio';
async function api(path,opts={}){const res=await fetch(path,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})},body:opts.body?JSON.stringify(opts.body):undefined,credentials:'same-origin'});const result=await res.json().catch(()=>({}));if(!res.ok)throw Error(result.error||`Request failed (${res.status})`);return result}
function pills(a){return(a||[]).map(x=>`<span class="pill">${esc(x)}</span>`).join('')}
function resumeSection(r={}){const entries=[['Professional summary','summary'],['Experience','experience'],['Achievements','achievements']].filter(([,key])=>String(r[key]||'').trim());if(!entries.length)return '';return '<div class="section"><div><div class="eyebrow">BACKGROUND</div><h2>Resume</h2></div></div><section class="glass skillbox">'+entries.map(([label,key])=>'<article><h3>'+esc(label)+'</h3><p>'+esc(r[key]).replace(/\n/g,'<br>')+'</p></article>').join('')+'</section>'}
function portfolio(){const p=data.profile;let ext=(url,label)=>url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${label} ↗</a>`:'';return `<main id="main" class="shell"><header class="bar"><div class="brand"><span class="logo">✦</span> ${esc(p.name||'Portfolio')}</div><div class="bar-actions">${ext(p.github,'GitHub')}${ext(p.linkedin,'LinkedIn')}<button class="btn" type="button" id="shareSite">Share portfolio</button><button class="btn" type="button" id="printSite">Print / Save PDF</button></div></header><section class="hero glass"><div class="hero-copy"><div class="eyebrow">${esc(p.location||'PERSONAL PORTFOLIO')}</div><h1>${esc(p.headline||p.name)}</h1><p>${esc(p.about)}</p><div class="hero-actions">${p.email?`<a class="btn primary" href="mailto:${encodeURIComponent(p.email)}">Get in touch ↗</a>`:''}${ext(p.website,'Website')}</div></div></section><div class="grid stats"><div class="glass stat"><strong>${data.projects.length.toString().padStart(2,'0')}</strong><span>Featured projects</span></div><div class="glass stat"><strong>${data.skills.length.toString().padStart(2,'0')}</strong><span>Skills and tools</span></div><div class="glass stat"><strong>${data.certificates.length.toString().padStart(2,'0')}</strong><span>Credentials</span></div></div><div class="section"><div><div class="eyebrow">SELECTED WORK</div><h2>Projects</h2></div></div><div class="grid projects">${data.projects.map(p=>`<article class="glass project"><div class="cover ${['green','orange'].includes(p.cover)?p.cover:''}">${esc(p.icon||'✦')}</div><h3>${esc(p.title)}</h3><p>${esc(p.description)}</p><div class="pills">${pills(p.tech)}</div><div class="project-links">${p.repo?`<a href="${esc(p.repo)}" target="_blank" rel="noopener noreferrer">Source code ↗</a>`:''}${p.demo?`<a href="${esc(p.demo)}" target="_blank" rel="noopener noreferrer">Live demo ↗</a>`:''}</div></article>`).join('')||'<p class="muted">Projects are being added soon.</p>'}</div><div class="section"><div><div class="eyebrow">CAPABILITIES</div><h2>Skills</h2></div></div><section class="glass skillbox"><div class="skills">${data.skills.map(s=>`<span class="skill">${esc(s.name)}</span>`).join('')||'<span class="muted">More to come.</span>'}</div></section>${data.certificates.length?`<div class="section"><div><div class="eyebrow">LEARNING</div><h2>Credentials</h2></div></div><div class="certs">${data.certificates.map(c=>`<article class="glass cert"><div class="certicon">✧</div><div><strong>${esc(c.name)}</strong><div class="muted">${esc(c.issuer)}${c.date?' · '+esc(c.date):''} ${c.credential?`· <a class="public-link" href="${esc(c.credential)}" target="_blank" rel="noopener noreferrer">View ↗</a>`:''}</div></div></article>`).join('')}</div>`:''}${resumeSection(data.resume)}<footer class="footer">Designed with care · ${new Date().getFullYear()}</footer></main>`}
function login(error=''){return `<main id="main" class="shell"><header class="bar"><div class="brand"><span class="logo">✦</span> Crackers</div><a class="btn" href="/portfolio">View public portfolio ↗</a></header><section class="login-wrap"><form class="glass login" id="loginForm"><div class="eyebrow">OWNER ACCESS</div><h1>Welcome back.</h1><p class="muted">Sign in to update your public portfolio.</p><label class="field"><span>Password</span><input type="password" name="password" autocomplete="current-password" required autofocus></label><button class="btn primary" type="submit">Sign in</button><div class="status" role="status">${esc(error)}</div></form></section></main>`}
function dash(){let p=data.profile;return `<main id="main" class="shell"><header class="bar"><div class="brand"><span class="logo">✦</span> Crackers</div><div class="bar-actions"><a class="btn hide-small" href="/portfolio" target="_blank" rel="noopener">↗ Preview site</a><div class="backup-tools"><button id="exportData" class="btn" type="button">Download backup</button><label class="btn hide-small" for="importData">Restore backup</label><input id="importData" type="file" accept="application/json,.json"></div><button id="logout" class="btn">Sign out</button></div></header><div class="dashgrid"><nav class="glass sidenav" aria-label="Dashboard sections"><h2>Workspace</h2><a href="#profile">Profile</a><a href="#projects">Projects (${data.projects.length})</a><a href="#skills">Skills</a><a href="#certificates">Credentials</a><a href="#resume">Resume</a><a class="btn primary" href="/portfolio" target="_blank" rel="noopener">View site ↗</a></nav><div><section class="glass editor"><div class="eyebrow">YOUR WORKSPACE</div><h1 style="font-size:36px">Your story, in one place.</h1><p class="muted">Edit your details, then preview the public page. Changes save to your server.</p><div class="notice">Your public portfolio is available at <strong>/portfolio</strong>. Keep project visibility checked to show a project. Download a backup of all content before major edits.</div></section><form class="glass editor" id="profileForm"><div class="eyebrow">INTRODUCTION</div><h2 id="profile">Profile</h2><div class="formgrid"><label class="field"><span>Name</span><input name="name" required value="${esc(p.name)}"></label><label class="field"><span>Professional headline</span><input name="headline" value="${esc(p.headline)}"></label><label class="field"><span>Location</span><input name="location" value="${esc(p.location)}"></label><label class="field"><span>Public email</span><input name="email" type="email" value="${esc(p.email)}"></label><label class="field"><span>Website URL</span><input name="website" type="url" value="${esc(p.website)}"></label><label class="field"><span>GitHub URL</span><input name="github" type="url" value="${esc(p.github)}"></label><label class="field"><span>LinkedIn URL</span><input name="linkedin" type="url" value="${esc(p.linkedin)}"></label><label class="field full"><span>About</span><textarea name="about">${esc(p.about)}</textarea></label></div><div class="formactions"><button class="btn primary">Save profile</button><span class="status" id="profileStatus" role="status"></span></div></form><section class="glass editor" id="projects"><div class="eyebrow">SHOW WHAT YOU CAN DO</div><h2>Projects</h2><div id="projectList">${projectList()}</div><h3 id="projectFormTitle">Add a project</h3><form id="projectForm"><div class="formgrid"><label class="field"><span>Project title</span><input name="title" required></label><label class="field"><span>Status</span><select name="status"><option>Completed</option><option>In progress</option><option>Concept</option></select></label><label class="field full"><span>Description</span><textarea name="description" required></textarea></label><label class="field full"><span>Technologies, comma separated</span><input name="tech" placeholder="JavaScript, CSS, Python"></label><label class="field"><span>Source URL</span><input name="repo" type="url"></label><label class="field"><span>Live demo URL</span><input name="demo" type="url"></label><label class="field"><span>Cover symbol</span><input name="icon" maxlength="8" value="✦"></label><label class="field"><span>Cover color</span><select name="cover"><option value="purple">Lavender</option><option value="green">Mint</option><option value="orange">Peach</option></select></label><label class="check field full"><input name="published" type="checkbox" checked> Show this project on the public site</label></div><div class="formactions"><button class="btn primary">Save project</button><button class="btn hidden" type="button" id="cancelEdit">Cancel edit</button><span class="status" id="projectStatus" role="status"></span></div></form></section><section class="glass editor" id="skills"><div class="eyebrow">YOUR TOOLKIT</div><h2>Skills</h2><p class="muted">Add names separated by commas.</p><form id="skillsForm"><label class="field"><span>Skills</span><input name="skills" value="${esc(data.skills.map(s=>s.name).join(', '))}" placeholder="React, Python, UX research"></label><div class="formactions"><button class="btn primary">Save skills</button><span class="status" id="skillsStatus" role="status"></span></div></form></section><section class="glass editor" id="certificates"><div class="eyebrow">LEARNING MILESTONES</div><h2>Credentials</h2><p class="muted">One credential per line: name | issuer | year | link (optional).</p><form id="certsForm"><label class="field"><span>Certificates</span><textarea name="certificates" placeholder="Web Development | Learning Academy | 2026 | https://example.com">${esc(data.certificates.map(c=>[c.name,c.issuer,c.date,c.credential].join(' | ')).join('\n'))}</textarea></label><div class="formactions"><button class="btn primary">Save credentials</button><span class="status" id="certsStatus" role="status"></span></div></form></section><section class="glass editor" id="resume"><div class="eyebrow">RESUME BUILDER</div><h2>Resume</h2><p class="muted">Add the details you want visitors to see. Empty sections stay private.</p><form id="resumeForm"><div class="formgrid"><label class="field full"><span>Professional summary</span><textarea name="summary">${esc(data.resume.summary||')}</textarea></label><label class="field full"><span>Experience</span><textarea name="experience" placeholder="Role, organization, dates, and what you contributed">${esc(data.resume.experience||')}</textarea></label><label class="field full"><span>Achievements</span><textarea name="achievements" placeholder="Awards, milestones, or measurable outcomes">${esc(data.resume.achievements||')}</textarea></label></div><div class="formactions"><button class="btn primary">Save resume</button><span class="status" id="resumeStatus" role="status"></span></div></form></section><footer class="footer">Crackers · Your data is saved on this server.</footer></div></div></main>`}
function projectList(){return data.projects.map(p=>`<div class="project-row"><div class="grow"><strong>${esc(p.title)}</strong><p>${esc(p.status)} · ${p.published?'Public':'Hidden'}</p></div><button class="btn" data-edit="${esc(p.id)}">Edit</button><button class="btn danger" data-delete="${esc(p.id)}">Remove</button></div>`).join('')||'<p class="muted">No projects yet. Add your first project below.</p>'}
async function saveAll(statusSel){try{await api('/api/data',{method:'PUT',body:data});$(statusSel).textContent='Saved';setTimeout(()=>{if($(statusSel))$(statusSel).textContent=''},2000)}catch(e){$(statusSel).textContent=e.message}}
function bindDash(){ $('#exportData').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='portfolioos-backup-'+new Date().toISOString().slice(0,10)+'.json';link.click();URL.revokeObjectURL(link.href)};$('#importData').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const imported=JSON.parse(await file.text());if(!imported.profile||!Array.isArray(imported.projects))throw Error('This file is not a Crackers backup.');if(!confirm('Restore this backup and replace the data currently saved on the server?'))return;await api('/api/data',{method:'PUT',body:imported});data=await api('/api/data');renderAdmin()}catch(err){alert(err.message||'Could not restore this backup.')}finally{e.target.value=''}};$('#logout').onclick=async()=>{await api('/api/logout',{method:'POST',body:{}});renderAdmin()};$('#profileForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.currentTarget);for(let k of ['name','headline','location','email','website','github','linkedin','about'])data.profile[k]=String(f.get(k)||'').trim();await saveAll('#profileStatus')};$('#skillsForm').onsubmit=async e=>{e.preventDefault();data.skills=new FormData(e.currentTarget).get('skills').split(',').map(n=>n.trim()).filter(Boolean).map(name=>({name,level:0,category:''}));await saveAll('#skillsStatus')};$('#certsForm').onsubmit=async e=>{e.preventDefault();data.certificates=new FormData(e.currentTarget).get('certificates').split('\n').map(line=>line.split('|').map(x=>x.trim())).filter(a=>a[0]).map(a=>({name:a[0]||'',issuer:a[1]||'',date:a[2]||'',credential:a[3]||''}));await saveAll('#certsStatus')};$('#resumeForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);data.resume={summary:String(f.get('summary')||'').trim(),experience:String(f.get('experience')||'').trim(),achievements:String(f.get('achievements')||'').trim()};await saveAll('#resumeStatus')};$('#projectForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.currentTarget),project={id:editId||crypto.randomUUID(),title:String(f.get('title')).trim(),status:f.get('status'),description:String(f.get('description')).trim(),tech:String(f.get('tech')).split(',').map(x=>x.trim()).filter(Boolean),repo:String(f.get('repo')).trim(),demo:String(f.get('demo')).trim(),icon:String(f.get('icon')).trim()||'✦',cover:f.get('cover'),published:f.has('published')};if(editId)data.projects=data.projects.map(p=>p.id===editId?project:p);else data.projects.push(project);await saveAll('#projectStatus');editId=null;renderAdmin()};$('#cancelEdit').onclick=()=>{editId=null;renderAdmin()};$('#projectList').onclick=e=>{let b=e.target.closest('[data-edit],[data-delete]');if(!b)return;if(b.dataset.delete){if(confirm('Remove this project?')){data.projects=data.projects.filter(p=>p.id!==b.dataset.delete);saveAll('#projectStatus').then(renderAdmin)}}else{let p=data.projects.find(x=>x.id===b.dataset.edit);if(!p)return;editId=p.id;let form=$('#projectForm');for(let [k,v] of Object.entries(p)){let el=form.elements[k];if(!el)continue;if(k==='tech')el.value=v.join(', ');else if(k==='published')el.checked=v;else el.value=v}$('#projectFormTitle').textContent='Edit project';$('#cancelEdit').classList.remove('hidden');form.scrollIntoView({behavior:'smooth',block:'center'})}}}
async function renderAdmin(){try{let session=await api('/api/session');if(session.authenticated){data=await api('/api/data');$('#app').innerHTML=dash();bindDash()}else{$('#app').innerHTML=login();$('#loginForm').onsubmit=async e=>{e.preventDefault();let status=$('.status',e.currentTarget);try{await api('/api/login',{method:'POST',body:{password:new FormData(e.currentTarget).get('password')}});data=await api('/api/data');$('#app').innerHTML=dash();bindDash()}catch(err){status.textContent=err.message}}}}catch(e){$('#app').innerHTML=`<main class="shell"><section class="glass login"><h1>Can’t connect</h1><p class="muted">${esc(e.message)} Try refreshing once the app server is running.</p></section></main>`}}
(async()=>{if(isPublic){try{data=await api('/api/portfolio');$('#app').innerHTML=portfolio();$('#printSite').onclick=()=>window.print();$('#shareSite').onclick=async()=>{try{if(navigator.share)await navigator.share({title:data.profile.name+' — Portfolio',url:location.href});else{await navigator.clipboard.writeText(location.href);alert('Portfolio link copied.')}}catch(e){if(e.name!=='AbortError')alert('Could not share this page. Copy the browser address instead.')}}}catch(e){$('#app').innerHTML=`<main class="shell"><div class="glass login"><h1>Portfolio unavailable</h1><p>${esc(e.message)}</p></div></main>`}}else renderAdmin()})();
</script></body></html>
