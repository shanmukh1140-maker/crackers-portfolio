.command-palette{width:min(560px,calc(100vw - 28px));max-height:min(680px,calc(100dvh - 36px));margin:12vh auto 0;padding:0;border:1px solid rgba(255,255,255,.86);border-radius:20px;background:rgba(249,250,255,.94);color:#172033;box-shadow:0 30px 100px rgba(20,27,53,.3);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%)}.command-palette::backdrop{background:rgba(14,20,39,.43);backdrop-filter:blur(5px)}.palette-search{display:flex;align-items:center;gap:11px;margin:12px;padding:12px 14px;border:1px solid rgba(106,111,160,.19);border-radius:13px;background:rgba(255,255,255,.78)}.palette-search>span{font-size:19px;color:#625bd1}.palette-search input{width:100%;border:0;outline:0;background:transparent;color:inherit}.palette-search input:focus{box-shadow:none}.command-palette h2{margin:20px 20px 9px;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#81899a}.palette-items{display:grid;gap:3px;padding:0 9px 10px}.palette-items button{display:flex;align-items:center;gap:12px;text-align:left;border:0;border-radius:10px;padding:11px 12px;background:transparent;color:#293149;font-weight:650}.palette-items button:hover,.palette-items button:focus-visible{background:rgba(101,91,220,.1);outline:none}.palette-items button>span{width:22px;color:#5d56d1;text-align:center}.palette-items kbd{margin-left:auto}.palette-hint{padding:12px 18px;border-top:1px solid rgba(120,130,157,.14);font-size:11px;color:#7b8498}
html[data-theme="dark"]{color-scheme:dark;--ink:#eef1fb;--muted:#a7b0c4;--panel:rgba(25,32,55,.76);--line:rgba(255,255,255,.12);--shadow:0 20px 55px rgba(0,0,0,.24)}html[data-theme="dark"] body{color:var(--ink);background:radial-gradient(ellipse at 12% 7%,rgba(102,87,217,.2),transparent 33%),radial-gradient(ellipse at 88% 15%,rgba(29,157,143,.12),transparent 30%),linear-gradient(135deg,#101625,#151b2d 56%,#101522)}html[data-theme="dark"] .topbar{background:rgba(19,25,42,.76);border-color:rgba(255,255,255,.09);color:var(--ink)}html[data-theme="dark"] .card:not(.welcome){background:rgba(27,35,58,.78);border-color:rgba(255,255,255,.11);box-shadow:0 18px 48px rgba(0,0,0,.18),inset 0 1px rgba(255,255,255,.04);color:var(--ink)}html[data-theme="dark"] .sub,html[data-theme="dark"] .stat-top,html[data-theme="dark"] .stat-note{color:var(--muted)}html[data-theme="dark"] .profile-mini p,html[data-theme="dark"] .activity small{color:#a7b0c4}html[data-theme="dark"] .tag,html[data-theme="dark"] .skill-chip{background:rgba(119,112,219,.15);border-color:rgba(180,175,255,.13);color:#dddafa}html[data-theme="dark"] .field input,html[data-theme="dark"] .field textarea,html[data-theme="dark"] .field select{background:rgba(13,19,34,.72);border-color:rgba(255,255,255,.15);color:var(--ink)}html[data-theme="dark"] .resume-preview{background:#fff;color:#172033}html[data-theme="dark"] .command-palette{background:rgba(25,31,50,.97);color:#f2f4fc;border-color:rgba(255,255,255,.14)}html[data-theme="dark"] .palette-search{background:rgba(11,16,29,.72);border-color:rgba(255,255,255,.12)}html[data-theme="dark"] .palette-search input{color:#f2f4fc}html[data-theme="dark"] .palette-items button{color:#e8ebf5}html[data-theme="dark"] .palette-items button:hover,html[data-theme="dark"] .palette-items button:focus-visible{background:rgba(146,135,255,.15)}html[data-theme="dark"] .palette-search kbd,html[data-theme="dark"] .palette-items kbd{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.13);color:#abb3c7}html[data-theme="dark"] .theme-toggle{color:#f6d786}
@media(max-width:900px){.sidebar{transform:translateX(-100%);transition:transform .24s ease;width:260px}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.mobile-menu{display:inline-flex}.content{padding:26px 24px 48px}.topbar{padding:0 20px}.hero,.two-col,.profile-layout{grid-template-columns:1fr}.welcome{min-height:220px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.projects{grid-template-columns:repeat(2,minmax(0,1fr))}}

<body>
<a class="skip-link" href="#mainContent">Skip to content</a><div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><span class="brand-icon">✦</span> Crackers</div><div class="nav-label">Workspace</div><nav class="nav" id="nav"><button class="active" data-page="overview"><span class="ico">◫</span> Overview</button><button data-page="profile"><span class="ico">♙</span> My profile</button><button data-page="projects"><span class="ico">▧</span> Projects showcase</button><button data-page="skills"><span class="ico">✳</span> Skills & expertise</button><button data-page="certificates"><span class="ico">♜</span> Certifications</button><button data-page="resume"><span class="ico">▤</span> Resume builder</button><button data-page="public"><span class="ico">↗</span> Public portfolio</button></nav><div class="side-bottom"><strong>✦ Your career, organized.</strong>Build your story. Show your work. Open doors to opportunity.</div></aside>
<main class="main" id="mainContent"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="btn mobile-menu" id="menuBtn" type="button" aria-label="Toggle navigation" aria-controls="sidebar" aria-expanded="false">☰</button><span class="crumb" id="crumb">Overview</span></div><div class="top-actions"><button class="btn command-trigger" id="commandBtn" type="button" aria-haspopup="dialog" aria-label="Search pages and actions, Control K"><span>⌕</span><span class="command-label">Quick search</span><kbd>Ctrl K</kbd></button><button class="btn theme-toggle" id="themeBtn" type="button" aria-label="Switch to dark theme" title="Switch theme">◐</button><button class="btn hide-mobile" id="previewBtn">↗ Preview portfolio</button><button class="btn primary" id="quickAdd">＋ Add project</button><div class="avatar" id="topAvatar">S</div></div></header><div class="content" id="content"></div></main></div><div class="toast" id="toast"></div><dialog class="command-palette" id="commandPalette" aria-labelledby="commandTitle"><div class="palette-search"><span aria-hidden="true">⌕</span><input id="commandSearch" type="search" placeholder="Search pages and actions…" autocomplete="off"><kbd>ESC</kbd></div><h2 id="commandTitle">Quick actions</h2><div class="palette-items" id="paletteItems"><button data-command="Overview" data-command-page="overview"><span>◫</span>Overview<kbd>1</kbd></button><button data-command="Profile" data-command-page="profile"><span>♙</span>My profile<kbd>2</kbd></button><button data-command="Projects showcase" data-command-page="projects"><span>▧</span>Projects showcase<kbd>3</kbd></button><button data-command="Skills expertise" data-command-page="skills"><span>✳</span>Skills &amp; expertise<kbd>4</kbd></button><button data-command="Certifications" data-command-page="certificates"><span>♜</span>Certifications<kbd>5</kbd></button><button data-command="Resume builder" data-command-page="resume"><span>▤</span>Resume builder<kbd>6</kbd></button><button data-command="Public portfolio preview" data-command-page="public"><span>↗</span>Public portfolio</button><button data-command="Add create new project" data-command-action="project"><span>＋</span>Add a project</button><button data-command="Toggle switch theme appearance" data-command-action="theme"><span>◐</span>Switch appearance</button></div><div class="palette-hint">Use the arrow keys to find a page, then select it</div></dialog>
<script>
const starter={profile:{name:'Student',headline:'Computer Science Student · Aspiring Software Developer',college:'ABC Institute of Technology',degree:'B.Tech, Computer Science',year:'2027',location:'Hyderabad, India',email:'alex.student@example.com',website:'',github:'',linkedin:'',about:'Curious and driven student who enjoys turning ideas into useful digital experiences. I build practical projects, explore modern web technologies, and believe in learning by doing.'},projects:[{id:1,title:'Student Task Manager',description:'A clean productivity app to organize assignments, deadlines and study goals in one place.',tech:['React','JavaScript','CSS'],status:'Completed',repo:'',demo:'',icon:'✓',cover:'purple'},{id:2,title:'Campus Connect',description:'A student-focused platform concept for discovering campus events and connecting with peers.',tech:['HTML','CSS','Firebase'],status:'In progress',repo:'',demo:'',icon:'⌘',cover:'green'},{id:3,title:'Smart Expense Tracker',description:'A simple dashboard to categorize spending, visualize monthly totals and set saving goals.',tech:['JavaScript','Charts','UI Design'],status:'Completed',repo:'',demo:'',icon:'₹',cover:'orange'}],skills:[{name:'HTML & CSS',level:90,category:'Technical'},{name:'JavaScript',level:75,category:'Technical'},{name:'Python',level:65,category:'Technical'},{name:'Communication',level:85,category:'Professional'},{name:'Problem solving',level:80,category:'Professional'}],certificates:[{id:1,name:'Web Development Fundamentals',issuer:'Learning Academy',date:'2026',credential:''},{id:2,name:'Python Programming Essentials',issuer:'Online Learning Platform',date:'2025',credential:''}],resume:{summary:'Motivated student eager to apply technical knowledge to real-world problems. Interested in software development, collaborative projects, and continuous learning.',experience:'Add internships, volunteering, part-time work, or practical experience here.',achievements:'Add awards, hackathons, workshops, leadership, or other achievements here.'}};
let data;try{data=JSON.parse(localStorage.getItem('crackersData'))||starter}catch{data=starter}if(data.profile&&data.profile.name==='Alex Johnson'){data.profile.name='Student';localStorage.setItem('crackersData',JSON.stringify(data))}let page='overview';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem('crackersData',JSON.stringify(data));const initials=()=>data.profile.name.split(/\s+/).map(s=>s[0]||'').slice(0,2).join('').toUpperCase()||'S';const tags=a=>(a||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('');const pageNames={overview:'Overview',profile:'My profile',projects:'Projects showcase',skills:'Skills & expertise',certificates:'Certifications',resume:'Resume builder',public:'Public portfolio'};
function toast(m){let t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2300)}function go(p){page=p;$('#crumb').textContent=pageNames[p];document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#sidebar').classList.remove('open');render()}
function head(k,t,s,actions=''){return `<div class="page-head"><div><div class="eyebrow">${k}</div><h1>${t}</h1><p class="sub">${s}</p></div>${actions}</div>`}
function projectCard(p){return `<article class="card project-card"><div class="project-cover ${esc(p.cover||'purple')}">${esc(p.icon||'✦')}</div><div style="display:flex;justify-content:space-between;gap:8px;align-items:start"><h3>${esc(p.title)}</h3><span class="badge" style="white-space:nowrap;background:${p.status==='In progress'?'#fff2d9':'#e6f8ef'};color:${p.status==='In progress'?'#9a6900':'#14845b'}">${esc(p.status)}</span></div><p>${esc(p.description)}</p><div class="tags">${tags(p.tech)}</div><div class="project-footer"><span>${p.repo?`<a href="${esc(p.repo)}" target="_blank" rel="noreferrer">GitHub ↗</a>`:'Personal project'}</span><span><button class="link" data-edit-project="${p.id}">Edit</button> · <button class="link" data-delete-project="${p.id}">Delete</button></span></div></article>`}
function render(){const p=data.profile;$('#topAvatar').textContent=initials();let c=$('#content');if(page==='overview'){c.innerHTML=head('STUDENT WORKSPACE',`Welcome back, ${esc(p.name.split(' ')[0])} 👋`,'Here’s your professional journey at a glance.',`<button class="btn" data-goto="profile">Edit profile</button>`)+`<div class="grid hero"><section class="card welcome"><div class="eyebrow" style="color:#b7b0ff">YOUR NEXT CHAPTER STARTS HERE</div><h2>Build your story.<br>Show what you can do.</h2><p>Bring your projects, skills, achievements and resume together in one professional space.</p><button class="btn" data-goto="public">View portfolio ↗</button></section><section class="card"><div class="profile-mini"><div class="big-avatar">${initials()}</div><div><h3>${esc(p.name)}</h3><p>${esc(p.headline)}</p><p>⌖ ${esc(p.location)}</p></div></div><div class="section-row"><h2>Profile snapshot</h2><button class="link" data-goto="profile">Edit</button></div><p class="sub" style="font-size:13px">${esc(p.about)}</p><div class="tags">${tags([p.degree,p.college].filter(Boolean))}</div></section></div><div class="grid stats"><div class="card"><div class="stat-top">Projects <span class="stat-icon">▧</span></div><div class="stat-num">${data.projects.length}</div><div class="stat-note">Work worth showcasing</div></div><div class="card"><div class="stat-top">Skills <span class="stat-icon">✳</span></div><div class="stat-num">${data.skills.length}</div><div class="stat-note">Capabilities you’ve listed</div></div><div class="card"><div class="stat-top">Certificates <span class="stat-icon">♜</span></div><div class="stat-num">${data.certificates.length}</div><div class="stat-note">Learning milestones</div></div><div class="card"><div class="stat-top">Resume <span class="stat-icon">▤</span></div><div class="stat-num">1</div><div class="stat-note">Editable resume draft</div></div></div><div class="section-row"><h2>Featured projects</h2><button class="link" data-goto="projects">View all projects →</button></div><div class="grid projects">${data.projects.slice(0,3).map(projectCard).join('')||'<div class="card empty">Add your first project to get started.</div>'}</div><div class="grid two-col" style="margin-top:22px"><section class="card"><div class="section-row" style="margin-top:0"><h2>Skills at a glance</h2><button class="link" data-goto="skills">Manage</button></div>${data.skills.slice(0,4).map(s=>`<div class="skill-line"><div class="skill-label"><span>${esc(s.name)}</span><strong>${s.level}%</strong></div><div class="bar"><span style="width:${Math.min(100,Math.max(0,s.level))}%"></span></div></div>`).join('')||'<p class="sub">Add skills to showcase your strengths.</p>'}</section><section class="card"><div class="section-row" style="margin-top:0"><h2>Recent credentials</h2><button class="link" data-goto="certificates">View all</button></div>${data.certificates.slice(0,3).map(x=>`<div class="activity"><div class="activity-icon">♜</div><div><strong>${esc(x.name)}</strong><small>${esc(x.issuer)} · ${esc(x.date)}</small></div></div>`).join('')||'<p class="sub">Add your first certificate.</p>'}</section></div>`}
else if(page==='profile'){c.innerHTML=head('YOUR IDENTITY','Your profile','Create a clear, confident introduction for recruiters and collaborators.')+`<div class="profile-layout"><section class="card profile-card"><div class="big-avatar">${initials()}</div><h2>${esc(p.name)}</h2><p class="sub">${esc(p.headline)}</p><div class="tags" style="justify-content:center">${tags([p.degree,p.year?'Class of '+p.year:''].filter(Boolean))}</div><p class="sub">${esc(p.location)}</p><button class="btn" data-goto="public">Preview public profile ↗</button></section><section class="card"><form id="profileForm"><div class="form-grid">${field('Full name','name',p.name)}${field('Professional headline','headline',p.headline)}${field('College / university','college',p.college)}${field('Degree / program','degree',p.degree)}${field('Graduation year','year',p.year)}${field('Location','location',p.location)}${field('Email','email',p.email,'email')}${field('Portfolio website','website',p.website)}${field('GitHub URL','github',p.github)}${field('LinkedIn URL','linkedin',p.linkedin)}${field('About me','about',p.about,'text',true)}</div><div class="form-actions"><button class="btn primary">Save profile</button><button class="btn" type="reset">Reset form</button></div></form></section></div>`}
else if(page==='projects'){c.innerHTML=head('YOUR WORK, VISUALLY','Projects showcase','Highlight the problems you solved, the tools you used and the results you achieved.',`<button class="btn primary" data-add-project>＋ Add project</button>`)+`<div class="grid projects">${data.projects.map(projectCard).join('')||'<div class="card empty">No projects yet. Add a project to begin your showcase.</div>'}</div><div id="projectEditor"></div>`}
else if(page==='skills'){c.innerHTML=head('WHAT YOU BRING','Skills & expertise','Keep your technical and professional strengths current.')+`<div class="grid two-col"><section class="card"><h2 style="margin-top:0">Your skill set</h2><div class="skill-chips">${data.skills.map((s,i)=>`<span class="skill-chip">${esc(s.name)} <small style="color:#777">${s.level}%</small><button title="Remove skill" data-remove-skill="${i}">×</button></span>`).join('')||'<p class="sub">No skills added yet.</p>'}</div></section><section class="card"><h2 style="margin-top:0">Add a skill</h2><form id="skillForm"><div class="field"><label>Skill name</label><input name="name" required placeholder="e.g. React, Communication"></div><div class="field" style="margin-top:12px"><label>Category</label><select name="category"><option>Technical</option><option>Professional</option><option>Domain</option><option>Tools</option></select></div><div class="field" style="margin-top:12px"><label>Proficiency (self-assessed)</label><input name="level" type="range" min="10" max="100" value="75" oninput="document.getElementById('skillLevel').textContent=this.value+'%'"/><span id="skillLevel">75%</span></div><button class="btn primary" style="margin-top:17px">＋ Add skill</button></form></section></div><div class="section-row"><h2>Skill proficiency</h2></div><div class="card">${data.skills.map(s=>`<div class="skill-line"><div class="skill-label"><span>${esc(s.name)} <small style="color:#8b93a4">· ${esc(s.category)}</small></span><strong>${s.level}%</strong></div><div class="bar"><span style="width:${Math.min(100,Math.max(0,s.level))}%"></span></div></div>`).join('')||'<p class="sub">Your skill bars will appear here.</p>'}</div>`}
else if(page==='certificates'){c.innerHTML=head('PROOF OF LEARNING','Certifications & achievements','Record courses, credentials, workshops and awards.')+`<div class="grid two-col"><section class="card"><h2 style="margin-top:0">Credentials</h2>${data.certificates.map(x=>`<div class="cert-row"><div class="cert-icon">♜</div><div><h3>${esc(x.name)}</h3><p>${esc(x.issuer)} · ${esc(x.date)}</p>${x.credential?`<a href="${esc(x.credential)}" target="_blank" rel="noreferrer">Verify credential ↗</a>`:''}</div><button class="btn" data-remove-cert="${x.id}">Remove</button></div>`).join('')||'<div class="empty">Your certifications will appear here.</div>'}</section><section class="card"><h2 style="margin-top:0">Add certification</h2><form id="certForm"><div class="field"><label>Certificate / award name</label><input name="name" required placeholder="e.g. AWS Cloud Practitioner"></div><div class="field" style="margin-top:12px"><label>Issuing organization</label><input name="issuer" required placeholder="Organization or platform"></div><div class="field" style="margin-top:12px"><label>Issue date / year</label><input name="date" placeholder="e.g. October 2026"></div><div class="field" style="margin-top:12px"><label>Credential verification URL</label><input name="credential" type="url" placeholder="https://..."></div><button class="btn primary" style="margin-top:17px">＋ Add credential</button></form><p class="sub" style="font-size:12px;margin-top:16px">This demo stores certificate details in your browser. It does not upload or verify certificate files.</p></section></div>`}
else if(page==='resume'){c.innerHTML=head('READY FOR YOUR NEXT OPPORTUNITY','Resume builder','Edit your resume content, preview it, then print or save it as a PDF.',`<button class="btn primary" id="downloadResume">↓ Export / Save PDF</button>`)+`<div class="grid two-col" style="align-items:start"><section class="card"><form id="resumeForm"><div class="field"><label>Professional summary</label><textarea name="summary">${esc(data.resume.summary)}</textarea></div><div class="field" style="margin-top:15px"><label>Experience / internships</label><textarea name="experience">${esc(data.resume.experience)}</textarea></div><div class="field" style="margin-top:15px"><label>Achievements / activities</label><textarea name="achievements">${esc(data.resume.achievements)}</textarea></div><button class="btn primary" style="margin-top:17px">Save resume</button></form><p class="sub" style="font-size:12px;margin-top:14px">Use “Export / Save PDF” and select “Save as PDF” in your browser’s print dialog.</p></section><section class="resume-preview" id="resumePreview"><h2>${esc(p.name)}</h2><p>${esc(p.headline)}<br>${esc(p.email)} · ${esc(p.location)}${p.linkedin?' · '+esc(p.linkedin):''}</p><h3>Professional Summary</h3><p>${esc(data.resume.summary)}</p><h3>Education</h3><p><strong>${esc(p.degree)}</strong><br>${esc(p.college)} · ${esc(p.year)}</p><h3>Technical & Professional Skills</h3><p>${data.skills.map(s=>esc(s.name)).join(' · ')}</p><h3>Projects</h3>${data.projects.map(x=>`<p><strong>${esc(x.title)}</strong><br>${esc(x.description)}<br><small>${(x.tech||[]).map(esc).join(' · ')}</small></p>`).join('')}<h3>Certifications</h3>${data.certificates.map(x=>`<p><strong>${esc(x.name)}</strong> — ${esc(x.issuer)} (${esc(x.date)})</p>`).join('')}<h3>Experience & Achievements</h3><p>${esc(data.resume.experience)}</p><p>${esc(data.resume.achievements)}</p></section></div>`}
else if(page==='public'){c.innerHTML=head('PUBLIC VIEW','Your portfolio preview','This is a local preview of how your portfolio content can look when published.',`<button class="btn primary" id="shareBtn">↗ Share preview</button>`)+`<section class="card" style="padding:clamp(22px,5vw,55px);background:linear-gradient(135deg,#171f3b,#252451);color:white;border:0"><div class="eyebrow" style="color:#b7b0ff">STUDENT PORTFOLIO</div><div style="display:flex;align-items:center;gap:20px;margin:20px 0"><div class="big-avatar" style="width:88px;height:88px;font-size:28px">${initials()}</div><div><h1 style="font-size:clamp(28px,5vw,42px);letter-spacing:-1.5px;margin:0">${esc(p.name)}</h1><p style="color:#d1d5e5;margin:5px 0">${esc(p.headline)}</p><p style="color:#b7bfd5;font-size:13px;margin:0">${esc(p.college)} · ${esc(p.location)}</p></div></div><p style="color:#e0e3ef;max-width:740px">${esc(p.about)}</p><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px">${p.github?`<a class="btn" href="${esc(p.github)}" target="_blank">GitHub ↗</a>`:''}${p.linkedin?`<a class="btn" href="${esc(p.linkedin)}" target="_blank">LinkedIn ↗</a>`:''}${p.email?`<a class="btn" href="mailto:${esc(p.email)}">Contact me</a>`:''}</div></section><div class="section-row"><h2>Selected projects</h2><span class="sub">${data.projects.length} projects</span></div><div class="grid projects">${data.projects.map(projectCard).join('')}</div><div class="grid two-col" style="margin-top:22px"><section class="card"><h2>Skills</h2><div class="skill-chips">${data.skills.map(s=>`<span class="skill-chip">${esc(s.name)}</span>`).join('')}</div></section><section class="card"><h2>Certifications</h2>${data.certificates.map(x=>`<div class="activity"><div class="activity-icon">♜</div><div><strong>${esc(x.name)}</strong><small>${esc(x.issuer)} · ${esc(x.date)}</small></div></div>`).join('')}</section></div><div class="footer">Crackers · A student portfolio preview · Edit details in your dashboard</div>`}
if(page==='overview'||page==='public'||page==='projects')bindProjectActions();c.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>go(b.dataset.goto));c.querySelectorAll('[data-add-project]').forEach(b=>b.onclick=()=>showProjectForm());c.querySelectorAll('[data-remove-skill]').forEach(b=>b.onclick=()=>{data.skills.splice(+b.dataset.removeSkill,1);save();render()});c.querySelectorAll('[data-remove-cert]').forEach(b=>b.onclick=()=>{data.certificates=data.certificates.filter(x=>x.id!==+b.dataset.removeCert);save();render();toast('Certification removed')});const pf=$('#profileForm');if(pf)pf.onsubmit=e=>{e.preventDefault();new FormData(pf).forEach((v,k)=>data.profile[k]=String(v).trim());save();render();toast('Profile saved')};const sf=$('#skillForm');if(sf)sf.onsubmit=e=>{e.preventDefault();let f=new FormData(sf);if(data.skills.some(s=>s.name.toLowerCase()===String(f.get('name')).trim().toLowerCase()))return toast('Skill already exists');data.skills.push({name:String(f.get('name')).trim(),category:f.get('category'),level:+f.get('level')});save();render();toast('Skill added')};const cf=$('#certForm');if(cf)cf.onsubmit=e=>{e.preventDefault();let f=new FormData(cf);data.certificates.push({id:Date.now(),name:String(f.get('name')).trim(),issuer:String(f.get('issuer')).trim(),date:String(f.get('date')).trim(),credential:String(f.get('credential')).trim()});save();render();toast('Certification added')};const rf=$('#resumeForm');if(rf)rf.onsubmit=e=>{e.preventDefault();new FormData(rf).forEach((v,k)=>data.resume[k]=String(v));save();render();toast('Resume saved')};const dr=$('#downloadResume');if(dr)dr.onclick=()=>window.print();const sh=$('#shareBtn');if(sh)sh.onclick=()=>{if(navigator.share)navigator.share({title:data.profile.name+' — Portfolio',text:'Student portfolio preview'}).catch(()=>{});else{navigator.clipboard?.writeText(location.href);toast('Preview link copied (only works for this file/location)')}}}
function field(label,name,value,type='text',full=false){return `<div class="field ${full?'full':''}"><label>${label}</label>${name==='about'?`<textarea name="${name}">${esc(value)}</textarea>`:`<input name="${name}" type="${type}" value="${esc(value)}" ${name==='email'?'required':''}>`}</div>`}
function bindProjectActions(){document.querySelectorAll('[data-edit-project]').forEach(b=>b.onclick=()=>showProjectForm(+b.dataset.editProject));document.querySelectorAll('[data-delete-project]').forEach(b=>b.onclick=()=>{if(confirm('Delete this project?')){data.projects=data.projects.filter(p=>p.id!==+b.dataset.deleteProject);save();render();toast('Project deleted')}})}
function showProjectForm(id){if(page!=='projects')go('projects');let old=id?data.projects.find(p=>p.id===id):null;let box=$('#projectEditor');if(!box)return;box.innerHTML=`<section class="card" style="margin-top:20px"><h2>${old?'Edit project':'Add a project'}</h2><form id="projectForm"><div class="form-grid"><div class="field"><label>Project title</label><input name="title" required value="${esc(old?.title||'')}" placeholder="e.g. Smart Attendance System"></div><div class="field"><label>Status</label><select name="status"><option ${old?.status==='Completed'?'selected':''}>Completed</option><option ${old?.status==='In progress'?'selected':''}>In progress</option><option ${old?.status==='Concept'?'selected':''}>Concept</option></select></div><div class="field full"><label>Project description</label><textarea name="description" required>${esc(old?.description||'')}</textarea></div><div class="field full"><label>Technologies (comma-separated)</label><input name="tech" value="${esc((old?.tech||[]).join(', '))}" placeholder="React, Python, SQL"></div><div class="field"><label>GitHub repository URL</label><input name="repo" type="url" value="${esc(old?.repo||'')}" placeholder="https://github.com/..."></div><div class="field"><label>Live demo URL</label><input name="demo" type="url" value="${esc(old?.demo||'')}" placeholder="https://..."></div><div class="field"><label>Cover symbol (emoji)</label><input name="icon" value="${esc(old?.icon||'✦')}" maxlength="4"></div><div class="field"><label>Cover theme</label><select name="cover"><option value="purple" ${old?.cover==='purple'?'selected':''}>Purple</option><option value="green" ${old?.cover==='green'?'selected':''}>Green</option><option value="orange" ${old?.cover==='orange'?'selected':''}>Orange</option></select></div></div><div class="form-actions"><button class="btn primary">${old?'Save changes':'Create project'}</button><button class="btn" type="button" id="cancelProject">Cancel</button></div></form></section>`;box.scrollIntoView({behavior:'smooth',block:'start'});$('#cancelProject').onclick=()=>box.innerHTML='';$('#projectForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.currentTarget);let obj={id:old?.id||Date.now(),title:String(f.get('title')).trim(),description:String(f.get('description')).trim(),status:f.get('status'),tech:String(f.get('tech')).split(',').map(x=>x.trim()).filter(Boolean),repo:String(f.get('repo')).trim(),demo:String(f.get('demo')).trim(),icon:String(f.get('icon')).trim()||'✦',cover:f.get('cover')};if(old)data.projects=data.projects.map(p=>p.id===old.id?obj:p);else data.projects.unshift(obj);save();render();toast(old?'Project updated':'Project created')}}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));$('#menuBtn').onclick=()=>{let open=$('#sidebar').classList.toggle('open');$('#menuBtn').setAttribute('aria-expanded',String(open))};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sidebar').classList.contains('open')){$('#sidebar').classList.remove('open');$('#menuBtn').setAttribute('aria-expanded','false')}});$('#previewBtn').onclick=()=>go('public');$('#quickAdd').onclick=()=>showProjectForm();document.addEventListener('click',e=>{let b=e.target.closest('[data-goto]');if(b)go(b.dataset.goto)});render();
// Saved appearance preference and a keyboard-accessible command palette.
const themeKey='crackersTheme',themeButton=$('#themeBtn'),commandButton=$('#commandBtn'),palette=$('#commandPalette'),commandSearch=$('#commandSearch');
function setTheme(theme){document.documentElement.dataset.theme=theme;localStorage.setItem(themeKey,theme);let dark=theme==='dark';themeButton.textContent=dark?'☀':'◐';themeButton.setAttribute('aria-label',dark?'Switch to light theme':'Switch to dark theme');themeButton.title=dark?'Switch to light theme':'Switch to dark theme'}
setTheme(localStorage.getItem(themeKey)==='dark'?'dark':'light');themeButton.onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
function openPalette(){if(!palette.open){palette.showModal();commandSearch.value='';palette.querySelectorAll('[data-command]').forEach(x=>x.hidden=false);requestAnimationFrame(()=>commandSearch.focus())}}
commandButton.onclick=openPalette;commandSearch.oninput=()=>{const q=commandSearch.value.trim().toLowerCase();palette.querySelectorAll('[data-command]').forEach(item=>item.hidden=!item.dataset.command.toLowerCase().includes(q))};
palette.addEventListener('click',e=>{const action=e.target.closest('[data-command-page],[data-command-action]');if(!action)return;palette.close();if(action.dataset.commandPage)go(action.dataset.commandPage);else if(action.dataset.commandAction==='project')showProjectForm();else if(action.dataset.commandAction==='theme')themeButton.click()});
palette.addEventListener('click',e=>{if(e.target===palette)palette.close()});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette()}if(palette.open&&e.key==='ArrowDown'){e.preventDefault();const visible=[...palette.querySelectorAll('[data-command]:not([hidden])')];let i=visible.indexOf(document.activeElement);visible[(i+1+visible.length)%visible.length]?.focus()}if(palette.open&&e.key==='ArrowUp'){e.preventDefault();const visible=[...palette.querySelectorAll('[data-command]:not([hidden])')];let i=visible.indexOf(document.activeElement);visible[(i-1+visible.length)%visible.length]?.focus()}});
</script></body></html>
