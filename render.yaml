services:
  - type: web
    name: portfolioos
    runtime: python
    buildCommand: python -m compileall -q server.py
    startCommand: python server.py
    healthCheckPath: /api/health
    disk:
      name: portfolioos-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PORTFOLIO_ADMIN_PASSWORD
        sync: false
      - key: PORTFOLIO_SESSION_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/portfolioos.db
